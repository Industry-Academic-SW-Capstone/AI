name: CI/CD (toss)

# 토스 배포 전용 브랜치. 이미지만 만들어 올리고, EC2 의 스택(Spring 저장소 docker-compose.prod.yml)에서 ai 만 다시 띄운다.
on:
  push:
    branches: [ toss/main ]
    paths:
      - app/**
      - Dockerfile
      - .github/workflows/**
  pull_request:
    branches: [ toss/main ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --no-cache-dir -r app/requirements.txt

      - name: Check syntax
        run: python -m compileall -q app

  cd:
    if: github.ref == 'refs/heads/toss/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stockit-ai:toss
            ${{ secrets.DOCKER_USERNAME }}/stockit-ai:toss-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart ai on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TOSS_SERVER_HOST }}
          username: ${{ secrets.TOSS_SERVER_USERNAME }}
          key: ${{ secrets.TOSS_SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/stockit
            # 스택이 아직 없으면(첫 배포 전) 이미지만 올려 두고 끝낸다.
            test -f docker-compose.prod.yml || { echo "스택이 아직 없어 이미지만 올렸습니다"; exit 0; }
            docker compose -f docker-compose.prod.yml pull ai
            docker compose -f docker-compose.prod.yml up -d ai
